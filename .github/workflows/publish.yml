name: Publish to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch: # 수동 트리거도 허용

# Add permissions for the workflow
permissions:
  contents: write # Required for creating tags and releases
  packages: write # Required for publishing packages
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      - name: Run tests (if any)
        run: pnpm test --passWithNoTests || echo "No tests found, skipping..."

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Use token for authenticated git operations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Auto increment version
        id: auto-version
        run: |
          node scripts/increment-version.js auto
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Commit version change
        run: |
          git add package.json
          git commit -m "chore: bump version to ${{ steps.auto-version.outputs.new-version }} [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git Tag
        run: |
          git tag v${{ steps.auto-version.outputs.new-version }}
          git push origin v${{ steps.auto-version.outputs.new-version }}

      - name: Generate Release Notes
        id: release-notes
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges | grep -v "chore: bump version" || echo "- Initial release")
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -10)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.auto-version.outputs.new-version }}
          name: Release v${{ steps.auto-version.outputs.new-version }}
          body: |
            ## 🚀 What's Changed
            ${{ steps.release-notes.outputs.changelog }}

            ## 📦 Installation
            ```bash
            npm install aim-guard-mcp@${{ steps.auto-version.outputs.new-version }}
            ```

            ## 🔗 Links
            - **NPM Package**: https://www.npmjs.com/package/aim-guard-mcp/v/${{ steps.auto-version.outputs.new-version }}
            - **Documentation**: https://github.com/AIM-Intelligence/AIM-MCP#readme
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
